name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leelabiologics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leelabiologics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SITE_URL: https://leelabiologics.com
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leelabiologics
      DATABASE_SSL: "false"
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-password-not-for-deployment
      ADMIN_SESSION_SECRET: ci-only-session-signing-secret-not-for-deployment-32bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
